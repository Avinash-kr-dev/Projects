<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
    <title>Digital Clock</title>
    <style>
      body {
        background-color: #402a23;
        color: #f3bc77;
      }

      .center {
        display: flex;
        height: 100vh;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      #clock {
        font-size: 40px;
        background-color: #1d1716;
        color: #ff9865;
        padding: 20px 50px;
        margin-top: 10px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="../index.html" aria-current="page">Home</a>
    </nav>

    <main class="center">
      <div id="banner">Your local time</div>
      <div id="clock"></div>
    </main>
    <script src="./script.js"></script>
  </body>

</html>
